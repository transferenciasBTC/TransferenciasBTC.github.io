<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones de Retiro BTC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #f7931a;
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .notification-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .notification-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .user {
            font-weight: bold;
            font-size: 18px;
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
            color: #f7931a;
        }

        .date {
            font-size: 13px;
            color: #777;
            margin-top: 4px;
        }

        .wallet-preview {
            font-size: 14px;
            color: #aaa;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #777;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 50px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 32px;
            cursor: pointer;
            color: #aaa;
        }

        .copy-btn {
            padding: 12px 24px;
            background: #f7931a;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .copy-btn:hover {
            background: #e07c15;
        }
    </style>
</head>
<body>
    <h1>Notificaciones de Retiro BTC</h1>
    
    <div class="notifications-list" id="notificationsList">
        <!-- Se llenará dinámicamente -->
    </div>

    <!-- Modal detalle -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">×</span>
            
            <h2 style="color: #f7931a; margin-bottom: 30px;">Detalle de Retiro BTC</h2>
            
            <div style="text-align: left;">
                <div style="margin: 20px 0;">
                    <div style="color: #a0a0a0; font-size: 14px;">Usuario</div>
                    <div style="background: rgba(0,0,0,0.3); padding: 14px; border-radius: 10px; margin-top: 5px;" id="modalUser">---</div>
                </div>

                <div style="margin: 20px 0;">
                    <div style="color: #a0a0a0; font-size: 14px;">Dirección de Wallet BTC</div>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <div style="flex: 1; background: rgba(0,0,0,0.3); padding: 14px; border-radius: 10px; word-break: break-all;" id="modalWallet">---</div>
                        <button class="copy-btn" onclick="copyWalletModal()">Copiar</button>
                    </div>
                </div>

                <div style="margin: 25px 0;">
                    <div style="color: #a0a0a0; font-size: 14px;">Monto a Retirar</div>
                    <div style="font-size: 34px; font-weight: bold; color: #f7931a; margin-top: 8px;" id="modalAmount">0.00000000 BTC</div>
                </div>

                <div style="margin: 20px 0;">
                    <div style="color: #a0a0a0; font-size: 14px;">Fecha</div>
                    <div style="background: rgba(0,0,0,0.3); padding: 14px; border-radius: 10px; margin-top: 5px;" id="modalDate">---</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let notifications = [];

        // Cargar notificaciones guardadas
        function loadNotifications() {
            const saved = localStorage.getItem('btcWithdrawNotifications');
            if (saved) {
                notifications = JSON.parse(saved);
            }
        }

        // Guardar notificaciones
        function saveNotifications() {
            localStorage.setItem('btcWithdrawNotifications', JSON.stringify(notifications));
        }

        // Cargar nuevo retiro desde URL
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const user = params.get('user');
            const wallet = params.get('wallet');
            const amount = params.get('amount');

            if (user && wallet && amount) {
                const newNotification = {
                    id: Date.now(),
                    user: decodeURIComponent(user),
                    wallet: wallet,
                    amount: parseFloat(amount),
                    date: new Date().toISOString()
                };
                
                notifications.unshift(newNotification);
                saveNotifications();
            }
        }

        // Formatear fecha
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Renderizar tarjetas
        function renderNotifications() {
            const container = document.getElementById('notificationsList');
            container.innerHTML = '';

            if (notifications.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No hay notificaciones aún</p>
                        <p style="font-size: 14px; margin-top: 10px;">
                            Agrega una usando el link con parámetros
                        </p>
                    </div>
                `;
                return;
            }

            notifications.forEach(notif => {
                const card = document.createElement('div');
                card.className = 'notification-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="user">${notif.user}</div>
                        <div class="amount">${notif.amount} BTC</div>
                    </div>
                    <div class="wallet-preview">\( {notif.wallet.substring(0, 14)}... \){notif.wallet.substring(notif.wallet.length-6)}</div>
                    <div class="date">${formatDate(notif.date)}</div>
                `;
                card.onclick = () => showDetail(notif);
                container.appendChild(card);
            });
        }

        // Mostrar detalle en modal
        let currentNotification = null;

        function showDetail(notif) {
            currentNotification = notif;
            document.getElementById('modalUser').textContent = notif.user;
            document.getElementById('modalWallet').textContent = notif.wallet;
            document.getElementById('modalAmount').textContent = notif.amount.toFixed(8) + ' BTC';
            document.getElementById('modalDate').textContent = formatDate(notif.date);
            
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function copyWalletModal() {
            if (!currentNotification) return;
            navigator.clipboard.writeText(currentNotification.wallet).then(() => {
                const btn = document.querySelector('.copy-btn');
                const original = btn.textContent;
                btn.textContent = '✓ Copiado';
                setTimeout(() => btn.textContent = original, 2000);
            });
        }

        // Inicializar todo
        window.onload = function() {
            loadNotifications();
            loadFromURL();
            renderNotifications();
        };
    </script>
</body>
</html>
